<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookshelf Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background">
        <img src="img/library/bookshelf.jpg" alt="Bookshelf Background">
    </div>
    <div class="container">
        <!-- Row 1: Top -->
        <div class="row">
            <img src="img/library/bookshelf_top.jpg" alt="Bookshelf Top">
        </div>

        <!-- Row 2: Numbered images -->
        <div class="middle-row">
            <div class="book-wrapper">
                <img src="img/library/bookshelf-1.jpg" alt="Bookshelf 1">
                <div class="book-clickable" data-shelf="bookshelf-1.jpg"></div>
            </div>
            <div class="book-wrapper">
                <img src="img/library/bookshelf-2.jpg" alt="Bookshelf 2">
                <div class="book-clickable" data-shelf="bookshelf-2.jpg"></div>
            </div>
            <div class="book-wrapper">
                <img src="img/library/bookshelf-3.jpg" alt="Bookshelf 3">
                <div class="book-clickable" data-shelf="bookshelf-3.jpg"></div>
            </div>
            <div class="book-wrapper">
                <img src="img/library/bookshelf-4.jpg" alt="Bookshelf 4">
                <div class="book-clickable" data-shelf="bookshelf-4.jpg"></div>
            </div>
            <div class="book-wrapper">
                <img src="img/library/bookshelf-5.jpg" alt="Bookshelf 5">
                <div class="book-clickable" data-shelf="bookshelf-5.jpg"></div>
            </div>
            <div class="book-wrapper">
                <img src="img/library/bookshelf-6.jpg" alt="Bookshelf 6">
                <div class="book-clickable" data-shelf="bookshelf-6.jpg"></div>
            </div>
            <div class="book-wrapper">
                <img src="img/library/bookshelf-7.jpg" alt="Bookshelf 7">
                <div class="book-clickable" data-shelf="bookshelf-7.jpg"></div>
            </div>
            <div class="book-wrapper">
                <img src="img/library/bookshelf-8.jpg" alt="Bookshelf 8">
                <div class="book-clickable" data-shelf="bookshelf-8.jpg"></div>
            </div>
        </div>

        <!-- Row 3: Bottom -->
        <div class="row">
            <img src="img/library/bookshelf_bottom.jpg" alt="Bookshelf Bottom">
        </div>
    </div>
    <div class="popup">
        <div class="popup-content"></div>
    </div>
    <a href="" target="_blank" style="display: none;">
        <img src="" alt="Book Cover">
    </a>
    <div class="popup-info" style="display: none;">
        <h2></h2>
        <p></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
